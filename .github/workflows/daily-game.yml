# Selección diaria: mantiene creados los juegos de hoy, mañana y pasado mañana (Madrid).
#
# GitHub Actions solo entiende UTC. Medianoche de Madrid son las 22:00 UTC en verano (CEST) y las
# 23:00 UTC en invierno (CET), así que el verano es el caso estrecho: es el que fija la hora.
#
# A las 18:00 UTC quedan 4 h de margen en verano y 5 h en invierno. Antes estaba a las 20:00 UTC
# con la idea de dejar 2 h, pero las ejecuciones reales caían entre las 20:53 y las 21:14 (los
# workflows programados de Actions entran en cola y se retrasan de forma habitual), así que el
# margen efectivo se quedaba en ~50 min. Ni a las 18:00 bastó: en octubre de 2026 las ejecuciones
# caían entre las 20:44 y las 22:27 UTC, y el 05/10 no había corrido aún a las 22:04, así que el
# 06/10 empezó sin juego. Por eso el script ya no crea solo el de mañana sino también el de pasado
# mañana: una ejecución con horas de retraso sigue dejando más de 24 h de colchón.
name: Daily Game

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Run daily game selection
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/select-daily-game.py
