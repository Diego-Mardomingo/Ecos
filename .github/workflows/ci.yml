# Red de seguridad del repo: no hay tests, así que lint + typecheck + build son la única
# comprobación automática. Los demás workflows son jobs de datos (crons), no CI.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Versión fijada: ubuntu-latest pasa a Ubuntu 26 desde el 19/10/2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Lee la versión de `packageManager` en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Comprueba la app y, por separado, el service worker (tsconfig.worker.json).
      - name: Typecheck
        run: pnpm typecheck

      # Valores ficticios a propósito: ninguna página se prerenderiza contra Supabase, así que el
      # build no necesita los secretos de producción y CI no depende de su configuración.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
        run: pnpm build
