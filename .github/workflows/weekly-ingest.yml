# Ingesta semanal: scrape 25 canciones/playlist.
# Ejecuta cada domingo a las 16:00 hora española.
# Nota: GitHub Actions solo usa UTC. 15:00 UTC = 16:00 CET (oct-mar) / 17:00 CEST (abr-sep).
name: Weekly Ingest

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Run weekly ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-weekly.py
