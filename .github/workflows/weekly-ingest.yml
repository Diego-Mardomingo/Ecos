# Ingesta semanal desde las playlists activas de Spotify (por bloques de 5 canciones; las
# playlists en modo "all", enteras). Dura 30-40 min.
# Ejecuta cada domingo a las 16:00 hora española.
# Nota: GitHub Actions solo usa UTC. 15:00 UTC = 16:00 CET (oct-mar) / 17:00 CEST (abr-sep).
name: Weekly Ingest

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # Margen sobre los ~40 min habituales; sin tope, un scraper colgado gastaría 6 h.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Run weekly ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-weekly.py
